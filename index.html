<!DOCTYPE html>
<html>

<head>
    <script src="main.js"></script>
    <script src="nfc.js"></script>
    <script src="players.js"></script>
    <script src="https://w.soundcloud.com/player/api.js"></script>
    <script>
        var tag = document.createElement('script');

        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="ui.css">
</head>

<body>
    <div id="popup">
        <h2>Write New Tag</h2>
        <h3>Music Source: <select id="provider">
                <optgroup label="Recommended">
                    <option>YouTube</option>
                    <option>SoundCloud</option>
                </optgroup>
            <option>Spotify</option>
            <option>Link</option>
            <option>HTTP GET Request</option>
            </select></h3>
        <h3>Link: <input id="link" type="url"></h3>
        <button onclick="hidePopup()">Close</button>
        <button onclick="writeTag(provider.value.toLowerCase().replaceAll(' ',''), link.value); hidePopup()">Write
            Tag</button>
    </div>
    <div class="recordContainer" onclick="document.documentElement.requestFullscreen()">
        <div id="record">
            <div class="hole" style="background-color: white;">
                <div class="hole" style="background-color: #4d3028; box-shadow: 3px 5px 5px black;"></div>
            </div>
        </div>
        <div id="arm"></div>
    </div>
    <div class="controlsContainer">
        <div class="display"><span id="display">OFF</span><br>
            <iframe width="99%" height="40" id="scplayer" src="https://w.soundcloud.com/player/?url=" scrolling="no"
                frameborder="no" allow="autoplay"></iframe>
        </div>
        <div id="controls"><button class="powerbtn" onclick="powerOn(this)"
                ontouchstart="clickFeedback()">Power</button><button ontouchstart="clickFeedback(this)"
                ontouchend="clickFeedback(this)" onclick="showPopup()" disabled id="writebtn">Write
                New</button><br><button id="fb" class="seekBtn" disabled ontouchstart="clickFeedback(this)"
                ontouchend="clickFeedback(this)">&#60;&#60;</button><button ontouchstart="clickFeedback(this)"
                ontouchend="clickFeedback(this)" disabled id="playbtn">Play/Pause</button><button id="ff"
                class="seekBtn" disabled ontouchstart="clickFeedback(this)"
                ontouchend="clickFeedback(this)">&#62;&#62;</button></div>
    </div>
    <div id="ytplayer"></div>
    <div id="spotplayer"></div>
    <audio src="clicksound.mp3" id="click"></audio>
    <audio src="silence.mp3" id="interruptor" loop></audio>
</body>

</html>
